name: Throne Linux amd64 build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish anything"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - cross_os: linux
            cross_arch: amd64
            go_version: "1.26.3"
      fail-fast: false
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      DEST: ${{ github.workspace }}/deployment/${{ matrix.cross_os }}-${{ matrix.cross_arch }}
    steps:
      - name: Prepare Ubuntu 20.04 build container
        shell: bash
        run: |
          set -xeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            unzip \
            xz-utils \
            zstd \
            tar \
            file \
            build-essential \
            pkg-config \
            python3
          rm -rf /var/lib/apt/lists/*

      - name: Checking out sources
        uses: actions/checkout@v4.2.2

      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v4.2.3
        with:
          path: artifacts.tgz
          key: CommonCache-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/*') }}-${{ matrix.go_version }}-ubuntu2004

      - name: Install Go and Protoc in Ubuntu 20.04 container
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          curl -fsSL "https://go.dev/dl/go${{ matrix.go_version }}.linux-amd64.tar.gz" -o /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/go/bin:$PATH"

          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip" -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /usr/local
          protoc --version
          go version

      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Clone cronet-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/parhelia512/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "9ed95366ae2f9b4b994cf54f8f9de0d8bc350057"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Download Chromium toolchain
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} download-toolchain

      - name: Set Chromium toolchain environment
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.cross_arch }} env >> "$GITHUB_ENV"

      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -xeuo pipefail
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh

      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: tar czvf artifacts.tgz ./deployment

      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-Common-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz

  build-cpp:
    permissions:
      contents: read
    needs:
      - build-go
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            qt_version: "6.11.1"
            target: x86_64
            dest_suffix: linux-amd64
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/${{ matrix.dest_suffix }}
      DEST_SUFFIX: ${{ matrix.dest_suffix }}
      ARCH: ${{ matrix.target }}
    steps:
      - name: Prepare Ubuntu 20.04 build container
        shell: bash
        run: |
          set -xeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            unzip \
            xz-utils \
            zstd \
            tar \
            file \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            libgl1-mesa-dev \
            libglx-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb1-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxcb-glx0 \
            libxcb-glx0-dev \
            libxcb-icccm4 \
            libxcb-icccm4-dev \
            libxcb-image0 \
            libxcb-image0-dev \
            libxcb-keysyms1 \
            libxcb-keysyms1-dev \
            libxcb-randr0 \
            libxcb-randr0-dev \
            libxcb-render0 \
            libxcb-render0-dev \
            libxcb-render-util0 \
            libxcb-render-util0-dev \
            libxcb-shape0 \
            libxcb-shape0-dev \
            libxcb-shm0 \
            libxcb-shm0-dev \
            libxcb-sync1 \
            libxcb-sync-dev \
            libxcb-util1 \
            libxcb-util-dev \
            libxcb-xfixes0 \
            libxcb-xfixes0-dev \
            libxcb-xinerama0 \
            libxcb-xinerama0-dev \
            libxcb-xkb1 \
            libxcb-xkb-dev
          rm -rf /var/lib/apt/lists/*
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade cmake ninja aqtinstall

      - name: Checking out sources
        uses: actions/checkout@v4.2.2
        with:
          submodules: "recursive"

      - name: Download Go Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: download-artifact

      - name: Install Qt inside Ubuntu 20.04 container
        shell: bash
        run: |
          set -xeuo pipefail
          aqt install-qt linux desktop "${{ matrix.qt_version }}" gcc_64 -O /opt/Qt
          QT_ROOT="/opt/Qt/${{ matrix.qt_version }}/gcc_64"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT/lib/cmake" >> "$GITHUB_ENV"

      - name: Linux - Generate MakeFile and Build
        shell: bash
        run: |
          set -xeuo pipefail
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" ..
          ninja
          cd ..
          ./script/deploy_linux64.sh

      - name: Verify binary does not require newer glibc than Ubuntu 20.04
        shell: bash
        run: |
          set -xeuo pipefail
          if [ -d "$DEST" ]; then
            find "$DEST" -type f -print0 | while IFS= read -r -d '' file; do
              if file "$file" | grep -q 'ELF'; then
                readelf -W --version-info "$file" 2>/dev/null | grep -o 'GLIBC_[0-9][0-9.]*' || true
              fi
            done | sort -Vu | tee glibc-required.txt
            if grep -E 'GLIBC_(2\.3[2-9]|2\.[4-9][0-9]|[3-9]\.)' glibc-required.txt; then
              echo "Found GLIBC requirement newer than Ubuntu 20.04 glibc 2.31"
              exit 1
            fi
          fi

      - name: Tar files
        shell: bash
        run: tar czvf artifacts.tgz ./deployment

      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-${{ matrix.dest_suffix }}
          path: artifacts.tgz

  publish:
    name: Pack & Publish Release
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    needs:
      - build-cpp
    permissions:
      contents: write
      actions: read
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare Ubuntu 20.04 packaging container
        shell: bash
        run: |
          set -xeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            zip \
            unzip \
            xz-utils \
            zstd \
            tar \
            file \
            desktop-file-utils \
            dpkg-dev \
            fakeroot
          rm -rf /var/lib/apt/lists/*

      - name: Checking out sources
        uses: actions/checkout@v4.2.2

      - name: Download Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: download-artifact

      - name: Pack Debian and zip packages
        shell: bash
        run: |
          set -xeuo pipefail
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .

          find . -name artifacts.tgz -print0 | xargs -0 -n1 tar xvzf

          cd deployment
          mkdir -p debug

          bash ../script/pack_debian.sh "${{ github.event.inputs.tag }}" amd64
          mv Throne.deb "Throne-${{ github.event.inputs.tag }}-debian-amd64.deb"
          rm -rf Throne

          cp -a linux-amd64 Throne
          if [ -f Throne/Throne.debug ]; then
            mv Throne/Throne.debug "debug/Throne-${{ github.event.inputs.tag }}-linux-amd64.debug"
          fi
          zip -9 -r "Throne-${{ github.event.inputs.tag }}-linux-amd64.zip" Throne
          rm -rf Throne

          zip -9 -r debug-symbols.zip debug

      - name: Build optional AppImage
        continue-on-error: true
        shell: bash
        run: |
          set -xeuo pipefail
          cd deployment

          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr"
          cp -a linux-amd64/. "$APPDIR/usr/"
          rm -f "$APPDIR/usr/Throne.debug"

          if [ ! -x "$APPDIR/usr/Throne" ]; then
            echo "Cannot find executable at $APPDIR/usr/Throne. Adjust this path if your deploy script uses a different layout."
            exit 1
          fi

          cat > "$APPDIR/Throne.desktop" <<'DESKTOP_EOF'
          [Desktop Entry]
          Type=Application
          Name=Throne
          Exec=Throne
          Icon=Throne
          Categories=Network;
          Terminal=false
          DESKTOP_EOF

          cat > "$APPDIR/Throne.svg" <<'SVG_EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#202020"/>
            <text x="128" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="86" font-weight="700" fill="#ffffff">T</text>
          </svg>
          SVG_EOF

          curl -fL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/Throne" \
            --desktop-file "$APPDIR/Throne.desktop" \
            --icon-file "$APPDIR/Throne.svg" \
            --output appimage

          mv ./*.AppImage "Throne-${{ github.event.inputs.tag }}-linux-amd64.AppImage"
          rm -rf "$APPDIR" linuxdeploy-x86_64.AppImage

      - name: Uploading Debug Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip

      - name: Clean Up
        shell: bash
        run: |
          set -xeuo pipefail
          cd deployment
          rm -rf linux-amd64
          rm -rf debug*

      - name: Uploading Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Deployment-${{ github.sha }}
          path: deployment

      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        shell: bash
        run: |
          ./ghr -prerelease -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment

      - name: Release
        if: github.event.inputs.publish == 'r'
        shell: bash
        run: |
          ./ghr -delete -c ${{ github.sha }} -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
